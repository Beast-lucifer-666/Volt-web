<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" shape-rendering="geometricPrecision">
  <defs>

    <radialGradient id="bgGrad" cx="38%" cy="32%" r="75%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#2a0a55"/>
      <stop offset="40%"  stop-color="#120328"/>
      <stop offset="100%" stop-color="#04010a"/>
    </radialGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#f0ebff"/>
      <stop offset="25%"  stop-color="#d8b4fe"/>
      <stop offset="60%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="orb1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="orb2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#10b981" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="coreGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#1e0540"/>
      <stop offset="100%" stop-color="#07011a"/>
    </radialGradient>

    <filter id="boltGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="haloGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="75"  cy="72"  rx="88" ry="68" fill="#7c3aed" opacity="0.14" filter="url(#ambientBlur)"/>
  <ellipse cx="182" cy="182" rx="72" ry="58" fill="#10b981" opacity="0.09" filter="url(#ambientBlur)"/>

  <!-- Outer dashed ring -->
  <circle cx="128" cy="128" r="106"
    fill="none" stroke="#a78bfa"
    stroke-width="0.6" stroke-dasharray="2 13" opacity="0.15"/>

  <!-- Orbit ellipse 1 — violet to emerald, -25deg -->
  <ellipse cx="128" cy="128" rx="96" ry="36"
    fill="none" stroke="url(#orb1Grad)"
    stroke-width="1.2" opacity="0.5"
    transform="rotate(-25 128 128)"/>

  <!-- Orbit ellipse 2 — emerald, +38deg -->
  <ellipse cx="128" cy="128" rx="74" ry="26"
    fill="none" stroke="url(#orb2Grad)"
    stroke-width="0.9" opacity="0.45"
    transform="rotate(38 128 128)"/>

  <!-- Plasma halo -->
  <circle cx="128" cy="128" r="72"
    fill="rgba(124,58,237,0.06)"
    stroke="#a78bfa" stroke-width="1.2" opacity="0.3"
    filter="url(#haloGlow)"/>

  <!-- Inner core -->
  <circle cx="128" cy="128" r="58"
    fill="url(#coreGrad)"
    stroke="#7c3aed" stroke-width="0.8" opacity="0.35"/>

  <!-- Inner dashed energy ring -->
  <circle cx="128" cy="128" r="44"
    fill="none" stroke="#10b981"
    stroke-width="0.7" stroke-dasharray="3 7" opacity="0.2"/>

  <!-- Orbiting dots -->
  <circle cx="128" cy="22"  r="5" fill="#c4b5fd" opacity="0.8" filter="url(#dotGlow)"/>
  <circle cx="234" cy="128" r="4" fill="#6ee7b7" opacity="0.7" filter="url(#dotGlow)"/>
  <circle cx="22"  cy="128" r="3" fill="#a78bfa" opacity="0.5"/>
  <circle cx="128" cy="234" r="3" fill="#10b981" opacity="0.5"/>

  <!-- Bolt glow blob -->
  <polygon points="143,60 108,120 128,120 110,196 156,126 134,126"
    fill="#a78bfa" opacity="0.25" filter="url(#ambientBlur)"/>

  <!-- Lightning bolt -->
  <g filter="url(#boltGlow)">
    <polygon points="143,60 108,120 128,120 110,196 156,126 134,126"
      fill="url(#boltGrad)"/>
  </g>

  <!-- Bolt highlight -->
  <polygon points="143,60 128,94 128,120 134,126 156,126"
    fill="white" opacity="0.12"/>

  <!-- Bottom scan line -->
  <line x1="64" y1="218" x2="192" y2="218"
    stroke="#a78bfa" stroke-width="0.8" opacity="0.2"/>
  <circle cx="128" cy="218" r="2.5" fill="#a78bfa" opacity="0.5"/>

</svg>
